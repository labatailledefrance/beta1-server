name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  rust:
    uses: labatailledefrance/.github/.github/workflows/rust.yml@2a2b9d8e0fd4a253d281d83127b4f4f67c20880d # v2.0.0
    with:
      # Catalogue valide et ordre des systèmes sans ambiguïté (E-02, F-01), puis
      # même hash d'état à 1 et à 16 threads (A-12).
      determinism: |
        cargo build --release --locked
        target/release/beta1-server --check
        a=$(target/release/beta1-server --determinism 2000 --threads 1)
        b=$(target/release/beta1-server --determinism 2000 --threads 16)
        echo "1 thread : $a ; 16 threads : $b"
        test "$a" = "$b"
    permissions:
      contents: read
  securite:
    uses: labatailledefrance/.github/.github/workflows/securite.yml@2a2b9d8e0fd4a253d281d83127b4f4f67c20880d # v2.0.0
    permissions:
      contents: read
  codeql:
    if: github.event.repository.visibility == 'public'
    uses: labatailledefrance/.github/.github/workflows/codeql.yml@2a2b9d8e0fd4a253d281d83127b4f4f67c20880d # v2.0.0
    permissions:
      contents: read
      actions: read
      security-events: write
  dco:
    if: github.event_name == 'pull_request'
    uses: labatailledefrance/.github/.github/workflows/dco.yml@2a2b9d8e0fd4a253d281d83127b4f4f67c20880d # v2.0.0
    permissions:
      contents: read
  # Image : seulement après fusion ou sur un tag (les PR de forks n'ont pas les
  # secrets de dhi.io).
  image:
    if: github.event_name == 'push'
    needs: [rust, securite]
    uses: labatailledefrance/.github/.github/workflows/image.yml@2a2b9d8e0fd4a253d281d83127b4f4f67c20880d # v2.0.0
    with:
      name: beta1-server
    secrets:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
